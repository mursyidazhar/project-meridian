:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}

.tab:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}

  if(T===0)body='<thead><tr><th>Skill</th><th>Domain</th><th class="num">Used in family profiles</th></tr></thead><tbody>'+SKD.map(function(r){var u=skillUse(r[0]);return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="num">'+(u||'–')+'</td></tr>'}).join('')+'</tbody>';
  if(T===1)body='<thead><tr><th>Name in the source system</th><th>Source</th><th>Standard skill</th><th>Status</th></tr></thead><tbody>'+ALIAS.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+st(r[3])+'</td></tr>'}).join('')+'</tbody>';
  if(T===2){
    extra='<div style="max-width:460px"><h3><label for="skfam">Job family</label></h3><select id="skfam">'+FAM.map(function(f){return '<option value="'+f.id+'"'+(f.id===S.skfam?' selected':'')+'>'+f.name+'</option>'}).join('')+'</select></div>';
    body='<thead><tr><th>Skill</th><th>Foundational</th><th>Skilled</th><th>Expert</th></tr></thead><tbody>'+FP[S.skfam].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+LV[r[1]]+'</td><td>'+LV[r[2]]+'</td><td>'+LV[r[3]]+'</td></tr>'}).join('')+'</tbody>';
  }
  var notes=['One standard name per skill. Everything else in the systems is mapped to these names.','Course and assessment names differ across systems. Each is mapped to one standard skill and checked before it counts.','The skills a job family expects at each band, and how deep. This is the standard that profiles and skill gaps are compared against.'];
  return head('Skills','The standard skill list, the names it replaces and the skills each job family expects. Read from the learning and assessment systems, normalised here and checked with unit managers. Nothing is written back.')+
  '<div class="strip">'+
  '<div class="stat"><span class="t">Standard skills</span><b>'+SKD.length+'</b><span class="c">one standard name per skill</span></div>'+
  '<div class="stat"><span class="t">Source skill names mapped</span><b>312</b><span class="c">of 540 names in the learning and assessment systems</span></div>'+
  '<div class="stat"><span class="t">Families with a skill profile</span><b>'+Object.keys(FP).length+'</b><span class="c">skills expected at each band</span></div>'+
  '<div class="stat warn"><span class="t">Skill records blank</span><b>45%</b><span class="c">of person records have no skills recorded</span></div></div>'+
  '<div class="tabs" role="tablist" aria-label="Skills master data">'+STABS.map(function(t,i){return '<button type="button" role="tab" class="tab" data-stab="'+i+'" aria-selected="'+(i===T)+'">'+t+'</button>'}).join('')+'</div>'+
  '<section class="card pad stack"><div class="srcline"><span class="chip">Source: Learning system, Assessment</span><span class="chip">Normalised in Meridian</span><span>'+notes[T]+'</span></div>'+extra+'<div class="scroll"><table>'+body+'</table></div></section>';
}

function findTask(id){var r=null;FAM.forEach(function(f){f.tasks.forEach(function(t){if(t.id===id)r={f:f,t:t}})});return r}
function masterChanged(f){recompute(f)}
function newTasksCard(){
  var rows=FAM.map(function(f){return f.newTasks.filter(function(n){return n.dec==='accept'&&nActive(f,n)}).map(function(n){return '<tr><td>'+esc(n.name)+'</td><td>'+esc(f.name)+'</td><td class="num">'+n.w+'%</td><td><div class="chips">'+n.skills.map(function(k){return '<span class="chip">'+k+'</span>'}).join('')+'</div></td><td>'+(function(){var c=classify(f,n);return '<span class="st '+(c.up?'ok':'warn')+'">'+(c.up?'Upskill':'Role design needed')+'</span> '+esc(c.role)})()+'</td><td><span class="chip add">New (post-automation)</span></td></tr>'}).join('')}).join('');
  return '<section class="card pad stack"><h3>Emerging tasks</h3><p class="note" style="margin:0">Accepted in Workforce Transformation. They describe future work and are not part of the current shares of work above.</p><div class="scroll"><table><thead><tr><th>Task</th><th>Job family</th><th class="num">Share of family capacity</th><th>Required skills</th><th>Lands in</th><th>Source</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="note" style="padding:14px">No emerging tasks accepted yet.</td></tr>')+'</tbody></table></div></section>';
}
function screenTasks(){
  var sel=S.tfam,list=FAM.filter(function(f){return sel==='all'||f.id===sel}),all=0,mapped=0,added=0,ok=0;
  FAM.forEach(function(f){all+=f.tasks.length;if(f.tot===100)ok++;f.tasks.forEach(function(t){if(t.skills&&t.skills.length)mapped++;if(t.src==='Added by user')added++})});
  var rows=list.map(function(f){return f.tasks.map(function(t){var add=t.src==='Added by user';
    return '<tr><td>'+esc(t.name)+'</td><td>'+esc(f.name)+'</td><td>'+taskRoleIdx(f,t).map(function(i){return esc(NATIVE[f.id][i])}).join(', ')+'</td><td class="num"><input type="number" class="wi" data-tw="'+t.id+'" min="0" max="100" step="1" value="'+t.w+'" aria-label="Share of work for '+esc(t.name)+'"></td><td>'+((t.skills&&t.skills.length)?'<div class="chips">'+t.skills.map(function(k){return '<span class="chip">'+k+'</span>'}).join('')+'</div>':'<span class="st warn">Not mapped</span>')+'</td><td><span class="chip'+(add?' add':'')+'">'+(add?'Added by user':'Standard catalogue')+'</span></td><td>'+(add?'<button type="button" class="ghost" data-tdel="'+t.id+'">Remove</button>':'')+'</td></tr>'}).join('')}).join('');
  var fopts='<option value="all"'+(sel==='all'?' selected':'')+'>All job families</option>'+FAM.map(function(f){return '<option value="'+f.id+'"'+(f.id===sel?' selected':'')+'>'+f.name+'</option>'}).join('');
  var nopts=FAM.map(function(f){return '<option value="'+f.id+'"'+(f.id===(sel==='all'?S.lib:sel)?' selected':'')+'>'+f.name+'</option>'}).join('');
  var sopts=SKD.map(function(k){return '<option value="'+k[0]+'">'+k[0]+'</option>'}).join('');
  var fam=sel==='all'?null:famById(sel);
  var ts=(function(){var n=0,top=null,sk=[],fids=list.map(function(f){return f.id});list.forEach(function(f){f.tasks.forEach(function(t){n++;(t.skills||[]).forEach(function(k){if(sk.indexOf(k)<0&&SKD.some(function(x){return x[0]===k}))sk.push(k)});if(!top||t.w>top.t.w)top={t:t,f:f}})});
    var rs=ROLES.filter(function(r){return fids.indexOf(r.fam)>=0}),rw=rs.filter(function(r){var ni=NATIVE[r.fam].indexOf(r.name);return ni>=0?roleLoad(famById(r.fam),ni).list.length>0:!!DTASKS[r.name]}).length;
    return {n:n,top:top,sk:sk.length,rs:rs.length,rw:rw}})();
  var bar=fam?'<div class="srcline"><span class="'+(fam.tot===100?'st ok':'st warn')+'">Weights add up to '+fam.tot+'%</span>'+(fam.tot===100?'':'<button type="button" class="ghost" id="tnorm">Scale weights to 100%</button>')+'<span>The assessment for this family needs weights that add up to 100%.</span></div>':'';
  return head('Tasks','The task catalogue per job family: what work each family does and how much of it each task makes up. Tasks come from standard catalogues and are the only place to add or change a task. AI Assessment reads this list. Nothing is written back to the HR system.','<span style="display:flex;gap:8px"><button type="button" class="btn sec" id="tcat">Reset catalogue</button><button type="button" class="btn" id="topen">Add task</button></span>')+
  '<div class="strip">'+
   '<div class="stat"><span class="t">Tasks</span><b>'+ts.n+'</b><span class="c">'+(fam?'in '+esc(fam.name):'across '+list.length+' job families')+(added?', '+added+' added by user':'')+'</span></div>'+
   '<div class="stat"><span class="t">Largest share of work</span><b style="font-size:20px;line-height:1.25">'+(ts.top?esc(ts.top.t.name):'None')+'</b><span class="c">'+(ts.top?ts.top.t.w+'% of '+esc(ts.top.f.name.split(' and ')[0])+' work':'')+'</span></div>'+
   '<div class="stat"><span class="t">Added by user</span><b>'+added+'</b><span class="c">tasks not in the standard catalogue</span></div></div>'+
  '<section class="card pad stack"><div style="max-width:460px"><h3><label for="tfam">Job family</label></h3><select id="tfam">'+fopts+'</select></div>'+bar+
   '<div class="scroll"><table><thead><tr><th>Task</th><th>Job family</th><th>Performed by</th><th class="num">Share of work (%)</th><th>Required skills</th><th>Source</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>'+
  '<dialog id="tdlg" class="tdlg" aria-labelledby="tdt"><div class="tdb"><div class="tdh"><h3 id="tdt">Add a task</h3><button type="button" class="ghost" id="tcancel" aria-label="Close">Close</button></div>'+
   '<label class="tdf"><span class="note">Task name</span><input type="text" id="tn" placeholder="e.g. Customer data review"></label>'+
   '<div class="tdr"><label class="tdf"><span class="note">Job family</span><select id="tnf" class="dec">'+nopts+'</select></label><label class="tdf" style="max-width:130px"><span class="note">Share of work (%)</span><input type="number" id="tw" min="1" max="100" step="1" placeholder="1 to 100"></label></div>'+
   '<div class="tdf"><span class="note" id="tnsl">Required skills</span><details class="msel" id="tnsd"><summary aria-labelledby="tnsl"><span class="msv" id="tnsv">Select skills</span></summary><div class="mselp">'+SKD.map(function(k){return '<label><input type="checkbox" data-sk="'+esc(k[0])+'"> '+esc(k[0])+'<small>'+esc(k[1])+'</small></label>'}).join('')+'</div></details></div>'+
   '<p class="note" id="tmsg" style="margin:0">A new task has no AI assessment yet. Run the AI analysis for that family in AI Assessment. Adding a task makes that family an AI estimate again until the new task has a decision.</p><div class="tdh" style="justify-content:flex-end"><button type="button" class="btn sec" id="tcancel2">Cancel</button><button type="button" class="btn" id="tadd">Add task</button></div></div></dialog>';
}
function render(keep){
  document.getElementById('main').innerHTML='<nav class="crumb" id="crumb" aria-label="Breadcrumb"></nav>'+[screen0,screenLib,screen2,function(){return ''},screenOrg,screenSk,screenTasks][S.screen]();
  renderShell();
  if(S.screen===0){rows0();panel0()}
  if(S.screen===1)updateLib();
  if(!keep)window.scrollTo(0,0);
  var mn=document.getElementById('main'),key=S.screen+':'+(S.screen===2?S.tfm:'');
  if(render.last!==undefined&&render.last!==key){mn.classList.remove('enter');void mn.offsetWidth;mn.classList.add('enter')}
  render.last=key;
}
/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.id==='topen'){var dg=document.getElementById('tdlg');if(dg&&dg.showModal)dg.showModal();return}
  if(e.target.id==='tcancel'||e.target.id==='tcancel2'||e.target.id==='tdlg'){var dc=document.getElementById('tdlg');if(dc)dc.close();return}
  var msd=document.getElementById('tnsd');if(msd&&msd.open&&!e.target.closest('#tnsd'))msd.open=false;
  var tg=e.target.closest('[data-toggle]');if(tg){if(tg.getAttribute('data-toggle')==='int')S.intOpen=!S.intOpen;else S.mdOpen=!S.mdOpen;renderShell();return}
  var stb=e.target.closest('[data-stab]');if(stb){S.stab=+stb.getAttribute('data-stab');render();return}
  var ot=e.target.closest('[data-otab]');if(ot){S.otab=+ot.getAttribute('data-otab');render();return}
  var g=e.target.closest('[data-go]');if(g){S.screen=+g.getAttribute('data-go');render();return}
  var tdl=e.target.closest('[data-tdel]');if(tdl){var ft=findTask(tdl.getAttribute('data-tdel'));ft.f.tasks=ft.f.tasks.filter(function(t){return t.id!==ft.t.id});masterChanged(ft.f);render();toast('Task removed');return}
  if(e.target.id==='tnorm'){var f3=famById(S.tfam),k=100/f3.tot,sum=0,big=f3.tasks[0];f3.tasks.forEach(function(t){t.w=Math.round(t.w*k);sum+=t.w;if(t.w>big.w)big=t});big.w+=100-sum;masterChanged(f3);render();toast('Weights scaled to 100%');return}
  if(e.target.id==='tcat'){FAM.forEach(function(f){f.tasks=JSON.parse(JSON.stringify(f.orig));recompute(f);initState(f);initNew(f);f.tasks.forEach(function(t){t.rev=f.id==='meter'})});S.plan={};render();toast('Catalogue reset to the standard tasks');return}
  if(e.target.id==='tadd'){var nm=document.getElementById('tn').value.trim(),w=parseInt(document.getElementById('tw').value,10),fa=famById(document.getElementById('tnf').value),msg=document.getElementById('tmsg');
    if(!nm||!(w>0&&w<=100)){msg.textContent='Enter a task name and a share between 1 and 100.';return}
    var sk=[].slice.call(document.querySelectorAll('[data-sk]:checked')).map(function(o){return o.getAttribute('data-sk')});
    fa.tasks.push({id:fa.id+'n'+(++S.nid),name:nm,w:w,ai:false,lvl:null,src:'Added by user',skills:sk,rev:false,upd:stamp()});masterChanged(fa);render();toast('Task added to '+fa.name);return}
  var as=e.target.closest('[data-assess]');if(as){S.lib=as.getAttribute('data-assess');S.screen=1;render();return}
  var f=e.target.closest('tr[data-fam]');if(f){S.fam=f.getAttribute('data-fam');rows0();panel0();return}
  var c=e.target.closest('[data-filt]');if(c){S.filt=c.getAttribute('data-filt');document.querySelectorAll('[data-filt]').forEach(function(b){b.setAttribute('aria-pressed',b===c)});rows0();return}
  if(e.target.id==='markrev'){libTasks().forEach(function(t){if(!t.rev){t.rev=true;t.upd=stamp()}});FAM.forEach(recompute);updateLib();toast('AI suggestions accepted for all tasks');return}
  if(e.target.id==='runai'){var n=0;libTasks().forEach(function(t){if(!t.lvl){t.lvl=assess(t);t.ai=t.lvl==='high';n++}});if(n){libChanged();toast('AI analysis assessed '+n+' task'+(n>1?'s':''))}else toast('All tasks already have an AI assessment');return}
  var txr=e.target.closest('tr[data-tx]');if(txr&&!e.target.closest('a,button')){var nx=txr.nextElementSibling;if(nx&&nx.classList.contains('txd')){nx.hidden=!nx.hidden;txr.classList.toggle('open',!nx.hidden)}return}
  var dtb=e.target.closest('[data-dtab]');if(dtb){S.dtab=+dtb.getAttribute('data-dtab');render(true);return}
  var tf=e.target.closest('[data-tfm]');if(tf){S.tfm=tf.getAttribute('data-tfm');S.dtab=0;render();return}
  var tp=e.target.closest('[data-toplan]');if(tp){S.tfm=tp.getAttribute('data-toplan');S.screen=2;render();return}
  var tt=e.target.closest('[data-totf]');if(tt){S.tfm=tt.getAttribute('data-totf');S.screen=2;render();return}
  if(e.target.id==='rsreset'){delete S.plan[S.tfm];render(true);toast('Reset to the AI suggestion');return}
  if(e.target.id==='libreset'){libTasks().forEach(function(t){if(t.lvl)t.ai=(t.lvl==='high');t.rev=false;t.upd=null});libChanged();toast('Decisions reset. Choose a decision for each task');return}

});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-fam]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',function(e){
  if(e.target.matches&&e.target.matches('[data-sk]')){var ck=[].slice.call(document.querySelectorAll('[data-sk]:checked')).map(function(o){return o.getAttribute('data-sk')}),sv=document.getElementById('tnsv');sv.textContent=ck.length?(ck.length<=3?ck.join(', '):ck.length+' skills selected'):'Select skills';sv.className='msv'+(ck.length?' on':'');return}
  if(e.target.id==='rsl'){S.plan[S.tfm]={rs:+e.target.value/100};render(true)}
  if(e.target.id==='tfm'){S.tff=e.target.value;render()}
  if(e.target.matches('[data-nw]')){var nn=famById(S.tfm).newTasks.filter(function(n){return n.id===e.target.getAttribute('data-nw')})[0],vv=parseInt(e.target.value,10);nn.w=isNaN(vv)?0:Math.max(0,Math.min(30,vv));render(true)}
  if(e.target.matches('[data-nd]')){var nd=famById(S.tfm).newTasks.filter(function(n){return n.id===e.target.getAttribute('data-nd')})[0];nd.dec=e.target.value;render(true)}
  if(e.target.id==='libfam'){S.lib=e.target.value;updateLib()}
  if(e.target.id==='tfam'){S.tfam=e.target.value;render()}
  if(e.target.matches('[data-tw]')){var ftw=findTask(e.target.getAttribute('data-tw')),v2=parseInt(e.target.value,10);ftw.t.w=isNaN(v2)?0:Math.max(0,Math.min(100,v2));ftw.t.upd=stamp();masterChanged(ftw.f);render()}
  if(e.target.id==='skfam'){S.skfam=e.target.value;render()}
  if(e.target.id==='mapfam'){S.mapfam=e.target.value;render()}
  if(e.target.matches('[data-ai]')){var td=libTask(e.target.getAttribute('data-ai'));td.ai=e.target.value==='1';td.rev=true;td.upd=stamp();libChanged()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='rsl'){var rv=document.getElementById('rslv');if(rv)rv.textContent=e.target.value+'%'}
  if(e.target.id==='q'){S.q=e.target.value;rows0()}
});
document.getElementById('theme').addEventListener('click',function(){
  var r=document.documentElement,dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  r.setAttribute('data-theme',dark?'light':'dark');
});
document.documentElement.setAttribute('data-theme','light');
buildRoles();
render();
</script>
